{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | Дворец творчества</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
    <style>
        .account-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .account-header {
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .account-header h2 {
            color: #2c3e50;
            font-size: 28px;
        }
        .account-info {
            margin-bottom: 30px;
        }
        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .info-label {
            width: 150px;
            font-weight: 600;
            color: #555;
        }
        .info-value {
            flex: 1;
            color: #333;
        }
        .my-clubs {
            margin-top: 30px;
        }
        .my-clubs h3 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .club-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .club-name {
            font-weight: 600;
            color: #2c3e50;
        }
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 30px;
            width: 100%;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px;
        }
        .error-message {
            text-align: center;
            color: #e74c3c;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>Children's Palace of Creativity</h1>
        <div class="back-home">
            <a href="{% url 'index' %}">← На главную</a>
        </div>
    </div>

    <div class="nav-bar">
        <ul class="nav-buttons">
            <li><a href="{% url 'activities' %}">Занятия</a></li>
            <li><a href="#">Преподаватели</a></li>
            <li><a href="#">О нас</a></li>
            <li><a href="#" id="accountBtn">Аккаунт</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="account-container" id="accountContainer">
            <div class="account-header">
                <h2>👤 Личный кабинет</h2>
            </div>

            <div class="account-info" id="userInfo">
                <div class="info-row">
                    <div class="info-label">ФИО:</div>
                    <div class="info-value" id="fullName">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Имя пользователя:</div>
                    <div class="info-value" id="username">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Дата рождения:</div>
                    <div class="info-value" id="birthDate">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Родитель:</div>
                    <div class="info-value" id="parentName">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Телефон родителя:</div>
                    <div class="info-value" id="parentPhone">—</div>
                </div>
            </div>

            <div class="my-clubs">
                <h3>📚 Мои кружки</h3>
                <div id="myClubsList">
                    <div class="empty-message">Загрузка...</div>
                </div>
            </div>

            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </div>

    <script>
        const studentId = localStorage.getItem('studentId');
        const username = localStorage.getItem('username');

        // Проверка авторизации - если нет studentId, перенаправляем на главную
        if (!studentId || studentId === 'null') {
            window.location.href = '/';
        }

        // Функция загрузки данных студента
        function loadStudentData() {
            // Дополнительная проверка перед запросом
            if (!studentId || studentId === 'null') {
                document.getElementById('myClubsList').innerHTML = '<div class="error-message">Ошибка: вы не авторизованы. <a href="/">Вернуться на главную</a></div>';
                return;
            }

            fetch(`/api/students/${studentId}/`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Студент не найден');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('fullName').textContent = data.full_name || '—';
                    document.getElementById('username').textContent = data.user?.username || username || '—';
                    document.getElementById('birthDate').textContent = data.birth_date || '—';
                    document.getElementById('parentName').textContent = data.parent_name || '—';
                    document.getElementById('parentPhone').textContent = data.parent_phone || '—';
                    loadStudentClubs(data.clubs || []);
                })
                .catch(error => {
                    console.error('Ошибка загрузки данных:', error);
                    document.getElementById('myClubsList').innerHTML = '<div class="error-message">Ошибка загрузки данных. Возможно, вы не авторизованы.</div>';
                });
        }

        function loadStudentClubs(clubs) {
            const container = document.getElementById('myClubsList');
            if (!clubs || clubs.length === 0) {
                container.innerHTML = '<div class="empty-message">Вы ещё не записаны ни на один кружок</div>';
                return;
            }

            container.innerHTML = clubs.map(club => `
                <div class="club-item">
                    <span class="club-name">🎨 ${club.name}</span>
                    <span>${club.min_age}–${club.max_age} лет</span>
                </div>
            `).join('');
        }

        function logout() {
            fetch('/api/logout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                }
            })
            .then(() => {
                localStorage.removeItem('studentId');
                localStorage.removeItem('userId');
                localStorage.removeItem('username');
                window.location.href = '/';
            })
            .catch(error => console.error('Ошибка выхода:', error));
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Загрузка при открытии страницы
        loadStudentData();
    </script>
</body>
</html>
